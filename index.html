<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>京都・大阪｜景點路線規劃</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24362d;
      --muted: #718078;
      --paper: #f7f5ef;
      --card: #fffefa;
      --line: #e6e7df;
      --green: #315b46;
      --green-dark: #244635;
      --mint: #e8f0e8;
      --orange: #d8814d;
      --shadow: 0 10px 35px rgba(36, 54, 45, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans CJK TC", "Noto Sans TC", system-ui, sans-serif;
      line-height: 1.55;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(1160px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 52px; }
    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      padding: 34px 38px;
      color: #fffefa;
      border-radius: 24px;
      background: linear-gradient(118deg, #244635 0%, #315b46 59%, #66806a 100%);
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "京";
      position: absolute;
      right: 28px;
      top: -48px;
      color: rgba(255,255,255,.07);
      font-family: serif;
      font-size: 240px;
      line-height: 1;
      pointer-events: none;
    }
    .hero-copy, .hero-stat { position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 8px; color: #d7e2d2; font-size: 12px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 0; font-family: serif; font-size: clamp(29px, 5vw, 45px); font-weight: 500; letter-spacing: .02em; line-height: 1.2; }
    .hero p { margin: 12px 0 0; color: #e2e9df; font-size: 14px; }
    .hero-stat { min-width: 126px; padding: 13px 17px; border: 1px solid rgba(255,255,255,.25); border-radius: 15px; background: rgba(255,255,255,.09); text-align: center; }
    .hero-stat strong { display: block; font-family: serif; font-size: 32px; line-height: 1.15; }
    .hero-stat span { color: #e2e9df; font-size: 12px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 23px 0 14px; }
    .toolbar-title { display: flex; align-items: baseline; gap: 12px; }
    h2 { margin: 0; font-family: serif; font-size: 23px; font-weight: 500; }
    .subtle { color: var(--muted); font-size: 12px; }
    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .button {
      min-height: 40px;
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
      transition: transform .15s, background .15s;
    }
    .button:hover { transform: translateY(-1px); background: #f2f4ee; }
    .button.primary { border-color: var(--green); background: var(--green); color: white; }
    .button.primary:hover { background: var(--green-dark); }
    .button:disabled { cursor: wait; opacity: .65; transform: none; }
    .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 17px 0; }
    .search {
      width: min(280px, 100%);
      min-height: 40px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline-color: var(--green);
      background: var(--card);
    }
    .chip {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: #5f6c64;
      font-size: 12px;
    }
    .chip.active { border-color: #cbd9cb; background: var(--mint); color: var(--green-dark); font-weight: 700; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, .9fr); align-items: start; gap: 19px; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .place-card {
      position: relative;
      min-width: 0;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      box-shadow: 0 4px 15px rgba(36,54,45,.025);
      transition: border .15s, box-shadow .15s;
    }
    .place-card:has(.place-check:checked) { border-color: #a8c0a9; box-shadow: 0 5px 20px rgba(49,91,70,.09); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .place-check { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--green); cursor: pointer; }
    .place-title { flex: 1; margin: 0; font-size: 15px; font-weight: 750; line-height: 1.45; }
    .tag { display: inline-flex; padding: 4px 8px; border-radius: 999px; background: #f1efe6; color: #766747; font-size: 10px; white-space: nowrap; }
    .place-area { margin: 10px 0 7px; color: var(--muted); font-size: 12px; }
    .place-meta { display: flex; flex-wrap: wrap; gap: 8px 13px; color: #53645a; font-size: 11px; }
    .place-recommend { margin: 11px 0 0; padding-top: 10px; border-top: 1px solid #f0f0e9; color: #526157; font-size: 11px; }
    .place-note { margin-top: 8px; color: #90958e; font-size: 10px; }
    .place-actions { display: flex; justify-content: flex-end; margin-top: 9px; }
    .text-button { padding: 3px 5px; border: 0; background: none; color: #8a6c54; font-size: 11px; }
    .planner {
      position: sticky;
      top: 15px;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .planner-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
    .planner-head h2 { font-size: 21px; }
    .count-pill { padding: 4px 10px; border-radius: 999px; background: var(--mint); color: var(--green); font-size: 11px; font-weight: 750; }
    .field { display: grid; gap: 6px; margin: 12px 0; }
    .field label { color: #5d6b62; font-size: 11px; font-weight: 700; }
    .field input, .field textarea, .field select {
      width: 100%;
      min-height: 39px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline-color: var(--green);
      background: #fff;
      color: var(--ink);
      font-size: 12px;
    }
    .field textarea { min-height: 65px; resize: vertical; }
    .planner .button { width: 100%; margin-top: 5px; }
    .route-message { display: none; margin-top: 12px; padding: 10px 11px; border-radius: 9px; background: #f5f2e9; color: #766747; font-size: 11px; }
    .route-message.show { display: block; }
    .route-message.error { background: #fbefeb; color: #9b503d; }
    .route-summary { margin-top: 16px; }
    .route-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 13px; }
    .stat-box { padding: 10px; border-radius: 10px; background: #f5f6f1; }
    .stat-box strong { display: block; font-size: 15px; }
    .stat-box span { color: var(--muted); font-size: 10px; }
    .route-list { display: grid; gap: 0; padding: 0; margin: 0; list-style: none; }
    .route-item { position: relative; display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 0 0 13px; }
    .route-item:not(:last-child)::after { position: absolute; top: 22px; bottom: 0; left: 11px; width: 1px; background: #d7dfd5; content: ""; }
    .route-number { position: relative; z-index: 1; display: grid; width: 23px; height: 23px; place-items: center; border-radius: 50%; background: var(--mint); color: var(--green); font-size: 10px; font-weight: 800; }
    .route-name { padding-top: 1px; font-size: 12px; font-weight: 700; line-height: 1.4; }
    .route-location { color: var(--muted); font-size: 10px; }
    .map-link { display: block; margin-top: 4px; text-align: center; text-decoration: none; }
    .empty-route { padding: 17px 12px; border: 1px dashed #d9ded5; border-radius: 11px; color: var(--muted); font-size: 11px; text-align: center; }
    .divider { height: 1px; margin: 18px 0; background: var(--line); }
    .add-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .add-heading h3 { margin: 0; font-size: 14px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .small-link { color: var(--green); font-size: 10px; }
    .footer { margin: 23px 2px 0; color: #828980; font-size: 10px; line-height: 1.7; }
    .footer a { color: var(--green); }
    .empty-cards { grid-column: 1 / -1; padding: 35px 15px; border: 1px dashed #d9ded5; border-radius: 14px; color: var(--muted); text-align: center; }
    @media (max-width: 790px) {
      .layout { grid-template-columns: 1fr; }
      .planner { position: static; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 540px) {
      .page { width: min(100% - 22px, 1160px); padding-top: 12px; }
      .hero { align-items: start; padding: 25px 20px; border-radius: 18px; }
      .hero-stat { min-width: 86px; padding: 9px; }
      .hero-stat strong { font-size: 25px; }
      .hero::after { right: -7px; top: -20px; font-size: 140px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .cards { grid-template-columns: 1fr; }
      .filters { gap: 7px; }
      .search { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">JAPAN TRIP · ITINERARY STUDIO</p>
        <h1>京都・大阪<br>景點路線規劃</h1>
        <p>挑選想去的店，整理成順路的旅行清單。</p>
      </div>
      <div class="hero-stat"><strong id="total-count">0</strong><span>個口袋名單</span></div>
    </header>

    <section aria-label="景點清單">
      <div class="toolbar">
        <div class="toolbar-title"><h2>口袋名單</h2><span class="subtle">勾選景點以加入行程</span></div>
        <div class="toolbar-actions">
          <button class="button" id="select-visible" type="button">選取目前清單</button>
          <button class="button" id="clear-selection" type="button">清除勾選</button>
        </div>
      </div>
      <div class="filters">
        <input class="search" id="search" type="search" placeholder="搜尋店名、地區或類型" aria-label="搜尋景點">
        <button class="chip active" data-filter="全部" type="button">全部</button>
        <button class="chip" data-filter="京都" type="button">京都</button>
        <button class="chip" data-filter="大阪" type="button">大阪</button>
        <button class="chip" data-filter="伴手禮" type="button">伴手禮</button>
        <button class="chip" data-filter="餐飲" type="button">餐飲</button>
      </div>
      <div class="layout">
        <div class="cards" id="place-list" aria-live="polite"></div>
        <aside class="planner">
          <div class="planner-head">
            <h2>今日路線</h2>
            <span class="count-pill" id="selected-count">0 個景點</span>
          </div>
          <div class="field">
            <label for="start-location">起點（選填）</label>
            <input id="start-location" type="text" placeholder="例如：京都車站">
          </div>
          <button class="button primary" id="optimize-route" type="button">✦　優化並規劃路線</button>
          <div class="route-message" id="route-message" role="status"></div>
          <div class="route-summary" id="route-summary">
            <div class="empty-route">先勾選想去的景點，再按「優化並規劃路線」</div>
          </div>
          <a class="button map-link" id="map-link" href="#" target="_blank" rel="noopener" hidden>在 Google 地圖開啟路線 ↗</a>
          <p class="footer">路線順序與車程為道路距離估算，需連線使用 OpenStreetMap / OSRM；實際交通、營業時間與大眾運輸請以當日資訊為準。</p>
          <div class="divider"></div>
          <form id="add-form">
            <div class="add-heading">
              <h3>新增景點</h3>
              <span class="subtle">會自動儲存在此瀏覽器</span>
            </div>
            <div class="field">
              <label for="new-name">景點名稱 *</label>
              <input id="new-name" name="name" required maxlength="100" placeholder="例如：清水寺">
            </div>
            <div class="two-col">
              <div class="field">
                <label for="new-region">地區 *</label>
                <input id="new-region" name="region" required maxlength="80" placeholder="京都東山">
              </div>
              <div class="field">
                <label for="new-city">城市</label>
                <select id="new-city" name="city">
                  <option value="京都">京都</option>
                  <option value="大阪">大阪</option>
                  <option value="其他">其他</option>
                </select>
              </div>
            </div>
            <div class="two-col">
              <div class="field">
                <label for="new-type">類型</label>
                <input id="new-type" name="type" maxlength="40" placeholder="寺院、餐飲…">
              </div>
              <div class="field">
                <label for="new-price">預算／人</label>
                <input id="new-price" name="price" maxlength="40" placeholder="¥1,000–2,000">
              </div>
            </div>
            <div class="field">
              <label for="new-address">地址或地圖搜尋地點（選填）</label>
              <input id="new-address" name="address" maxlength="160" placeholder="若地區名稱不夠精確，可填完整地址">
            </div>
            <div class="field">
              <label for="new-note">備註（選填）</label>
              <textarea id="new-note" name="note" maxlength="300" placeholder="營業時間、想吃的餐點、預約提醒…"></textarea>
            </div>
            <button class="button" type="submit">＋　加入口袋名單</button>
          </form>
        </aside>
      </div>
    </section>
  </main>

  <script>
    "use strict";
    const STORAGE_KEY = "kyoto-osaka-route-planner-v1";
    const initialPlaces = [
      { id: "p1", city: "京都", name: "京の焼肉処 弘 八条口店", type: "和牛燒肉", price: "¥5,000–8,000", popularity: "★★★★", rating: "★★★★", region: "京都車站八條口", fit: "伏見住宿：排京都車站行程後用餐，再轉乘回住宿", meal: "晚", note: "價位估算；依當日菜單確認和牛品項，建議先查營業時間及預約。", selected: false },
      { id: "p2", city: "大阪", name: "松阪牛焼肉M 法善寺横丁店", type: "松阪牛燒肉", price: "¥6,000–10,000", popularity: "★★★★", rating: "★★★★", region: "大阪難波／法善寺橫丁", fit: "西九條搭阪神難波線至大阪難波後步行；適合安排難波晚餐", meal: "晚", note: "價位估算；熱門店建議預約，確認當日菜單、營業時間與交通。", selected: false },
      { id: "p3", city: "京都", name: "伏見酒藏街（黃櫻／月桂冠等酒藏商品）", type: "清酒、酒藏點心", price: "¥1,000–3,000", popularity: "★★★★", rating: "★★★★", region: "伏見", fit: "住宿在伏見附近時最順路；可選小瓶清酒或常溫點心", meal: "伴手禮", note: "依酒款及盒裝而異；若搭機，先確認航空公司行李規定及入境酒類限制。", selected: false },
      { id: "p4", city: "京都", name: "マールブランシュ「茶の菓」", type: "抹茶餅乾", price: "¥1,000–2,000", popularity: "★★★★★", rating: "★★★★", region: "京都車站／伊勢丹", fit: "離京都車站行程近，適合最後一天集中購買", meal: "伴手禮", note: "盒裝方便分送；確認賞味期限及常溫保存條件。", selected: false },
      { id: "p5", city: "京都", name: "阿闍梨餅（京都車站店／伊勢丹等）", type: "和菓子、紅豆餅", price: "¥1,000–2,000", popularity: "★★★★★", rating: "★★★★", region: "京都車站", fit: "回程前購買方便；適合喜歡日式甜點者", meal: "伴手禮", note: "可按人數買散裝；確認當日庫存、賞味期限及保存方式。", selected: false },
      { id: "p6", city: "大阪", name: "青木松風庵「月化粧」", type: "奶油饅頭", price: "¥1,000–2,000", popularity: "★★★★", rating: "★★★★", region: "難波／大阪車站等伴手禮店", fit: "西九條往難波或大阪站行程順路；常溫盒裝較好攜帶", meal: "伴手禮", note: "價位依盒裝；購買時確認賞味期限及販售店庫存。", selected: false },
      { id: "p7", city: "大阪", name: "りくろーおじさんの店（難波本店）", type: "起司蛋糕", price: "¥1,000–1,500", popularity: "★★★★★", rating: "★★★", region: "難波", fit: "西九條搭阪神難波線到大阪難波後步行；適合當天吃或短程帶回", meal: "伴手禮", note: "留意排隊、保存方式與賞味期限；長途攜帶前確認冷藏及入境規定。", selected: false }
    ];
    let places = loadPlaces();
    let activeFilter = "全部";
    let searchText = "";
    let routeResult = null;

    function loadPlaces() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        return Array.isArray(saved) ? saved.filter((p) => p && p.id && p.name && p.region) : initialPlaces;
      } catch (error) {
        console.warn("無法讀取已儲存的景點清單，改用試算表資料。", error);
        return initialPlaces;
      }
    }
    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(places));
      } catch (error) {
        showMessage("無法儲存到此瀏覽器，可能是儲存空間不足或瀏覽器限制。", true);
        console.error("儲存景點清單失敗。", error);
      }
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }
    function matchesFilter(place) {
      if (activeFilter === "全部") return true;
      if (activeFilter === "餐飲") return place.meal !== "伴手禮" && /餐|燒肉|咖啡|料理|食/.test(place.type);
      if (activeFilter === "伴手禮") return place.meal === "伴手禮";
      return place.city === activeFilter;
    }
    function render() {
      const visible = places.filter((p) => matchesFilter(p) && `${p.name} ${p.region} ${p.type} ${p.city}`.toLowerCase().includes(searchText.toLowerCase()));
      document.getElementById("total-count").textContent = places.length;
      document.getElementById("selected-count").textContent = `${places.filter((p) => p.selected).length} 個景點`;
      const list = document.getElementById("place-list");
      if (!visible.length) {
        list.innerHTML = '<div class="empty-cards">找不到符合條件的景點。可以換個關鍵字，或在右側新增景點。</div>';
        return;
      }
      list.innerHTML = visible.map((p) => `
        <article class="place-card">
          <div class="card-top">
            <input class="place-check" type="checkbox" aria-label="選取 ${escapeHtml(p.name)}" data-select="${escapeHtml(p.id)}" ${p.selected ? "checked" : ""}>
            <h3 class="place-title">${escapeHtml(p.name)}</h3>
            <span class="tag">${escapeHtml(p.city)}</span>
          </div>
          <p class="place-area">${escapeHtml(p.region)}</p>
          <div class="place-meta">
            ${p.type ? `<span>${escapeHtml(p.type)}</span>` : ""}
            ${p.price ? `<span>${escapeHtml(p.price)}／人</span>` : ""}
            ${p.popularity ? `<span>人氣 ${escapeHtml(p.popularity)}</span>` : ""}
          </div>
          ${p.fit ? `<p class="place-recommend">${escapeHtml(p.fit)}</p>` : ""}
          ${p.note ? `<p class="place-note">${escapeHtml(p.note)}</p>` : ""}
          ${p.custom ? `<div class="place-actions"><button class="text-button" type="button" data-delete="${escapeHtml(p.id)}">移除自訂景點</button></div>` : ""}
        </article>`).join("");
      list.querySelectorAll("[data-select]").forEach((input) => {
        input.addEventListener("change", () => {
          const place = places.find((p) => p.id === input.dataset.select);
          if (place) place.selected = input.checked;
          routeResult = null;
          persist();
          render();
          document.getElementById("route-summary").innerHTML = '<div class="empty-route">景點已更新，按「優化並規劃路線」產生路線。</div>';
          document.getElementById("map-link").hidden = true;
        });
      });
      list.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => {
          places = places.filter((p) => p.id !== button.dataset.delete);
          routeResult = null;
          persist();
          render();
        });
      });
    }
    function showMessage(message, isError = false) {
      const node = document.getElementById("route-message");
      node.textContent = message;
      node.className = `route-message show${isError ? " error" : ""}`;
    }
    function clearMessage() {
      document.getElementById("route-message").className = "route-message";
    }
    function wait(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
    async function geocode(query) {
      const url = new URL("https://nominatim.openstreetmap.org/search");
      url.searchParams.set("q", query);
      url.searchParams.set("format", "jsonv2");
      url.searchParams.set("limit", "1");
      const response = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!response.ok) throw new Error(`地點搜尋服務回應 ${response.status}`);
      const results = await response.json();
      if (!results.length) throw new Error(`找不到地點「${query}」，請補上更完整的地址或區域。`);
      return { lat: Number(results[0].lat), lon: Number(results[0].lon) };
    }
    function queryFor(place) {
      return place.address ? `${place.name} ${place.address} Japan` : `${place.name} ${place.region} ${place.city} Japan`;
    }
    async function durationMatrix(points) {
      const coordinates = points.map((p) => `${p.lon},${p.lat}`).join(";");
      const response = await fetch(`https://router.project-osrm.org/table/v1/driving/${coordinates}?annotations=duration,distance`);
      if (!response.ok) throw new Error(`道路路線服務回應 ${response.status}`);
      const data = await response.json();
      if (data.code !== "Ok" || !data.durations) throw new Error("目前無法取得這些景點間的道路路線，請稍後再試。");
      return data.durations;
    }
    function routeCost(order, matrix) {
      let sum = 0;
      for (let i = 1; i < order.length; i++) {
        const value = matrix[order[i - 1]][order[i]];
        if (value == null) return Infinity;
        sum += value;
      }
      return sum;
    }
    function improveRoute(order, matrix, fixedStart) {
      let best = order.slice();
      let changed = true;
      while (changed) {
        changed = false;
        const first = fixedStart ? 1 : 0;
        for (let i = first; i < best.length - 1; i++) {
          for (let k = i + 1; k < best.length; k++) {
            const candidate = best.slice();
            candidate.splice(i, k - i + 1, ...best.slice(i, k + 1).reverse());
            if (routeCost(candidate, matrix) + 0.01 < routeCost(best, matrix)) {
              best = candidate;
              changed = true;
            }
          }
        }
      }
      return best;
    }
    function optimizeOrder(matrix, fixedStart) {
      const size = matrix.length;
      if (!fixedStart && size < 2) return size ? [0] : [];
      const starts = fixedStart ? [0] : Array.from({ length: size }, (_, i) => i);
      let winner = null;
      let winnerCost = Infinity;
      for (const start of starts) {
        const remaining = new Set(Array.from({ length: size }, (_, i) => i).filter((i) => i !== start));
        const order = [start];
        while (remaining.size) {
          const current = order[order.length - 1];
          let next = null;
          let min = Infinity;
          for (const candidate of remaining) {
            const cost = matrix[current][candidate];
            if (cost != null && cost < min) { min = cost; next = candidate; }
          }
          if (next === null) throw new Error("景點之間沒有可用的道路連線，請檢查地點名稱或分開規劃。");
          order.push(next);
          remaining.delete(next);
        }
        const improved = improveRoute(order, matrix, fixedStart);
        const cost = routeCost(improved, matrix);
        if (cost < winnerCost) { winner = improved; winnerCost = cost; }
      }
      if (!winner || !Number.isFinite(winnerCost)) throw new Error("無法計算完整路線，請減少景點或確認地點。");
      return winner;
    }
    function formatDuration(seconds) {
      const mins = Math.round(seconds / 60);
      if (mins < 60) return `約 ${mins} 分鐘`;
      return `約 ${Math.floor(mins / 60)} 小時 ${mins % 60} 分`;
    }
    function renderRoute(stops, matrix, order, fixedStart, points, placesByIndex) {
      const routeStops = order.filter((index) => !fixedStart || index !== 0).map((index) => placesByIndex[index]);
      const legs = [];
      for (let i = 1; i < order.length; i++) {
        legs.push({ duration: matrix[order[i - 1]][order[i]], distance: null });
      }
      const duration = legs.reduce((sum, leg) => sum + (leg.duration || 0), 0);
      const routeCoordinates = order.map((index) => points[index]);
      const distanceUrl = `https://router.project-osrm.org/route/v1/driving/${routeCoordinates.map((p) => `${p.lon},${p.lat}`).join(";")}?overview=false&steps=false`;
      return fetch(distanceUrl).then(async (response) => {
        if (!response.ok) throw new Error(`道路路線服務回應 ${response.status}`);
        const data = await response.json();
        if (data.code !== "Ok" || !data.routes?.length) throw new Error("無法取得道路距離，請稍後再試。");
        const routeDistance = data.routes[0].distance;
        const routeDuration = data.routes[0].duration || duration;
        const summary = document.getElementById("route-summary");
        summary.innerHTML = `
          <div class="route-stats">
            <div class="stat-box"><strong>${(routeDistance / 1000).toFixed(1)} km</strong><span>道路距離估算</span></div>
            <div class="stat-box"><strong>${formatDuration(routeDuration)}</strong><span>不含停留的車程</span></div>
          </div>
          <ol class="route-list">${routeStops.map((place, i) => `
            <li class="route-item">
              <span class="route-number">${i + 1}</span>
              <div><div class="route-name">${escapeHtml(place.name)}</div><div class="route-location">${escapeHtml(place.region)}</div></div>
            </li>`).join("")}</ol>`;
        const startQuery = document.getElementById("start-location").value.trim();
        const mapPoints = startQuery ? [startQuery, ...routeStops.map((p) => `${p.name} ${p.region}`)] : routeStops.map((p) => `${p.name} ${p.region}`);
        const mapUrl = new URL("https://www.google.com/maps/dir/");
        mapUrl.searchParams.set("api", "1");
        mapUrl.searchParams.set("destination", mapPoints[mapPoints.length - 1]);
        if (mapPoints.length > 1) mapUrl.searchParams.set("waypoints", mapPoints.slice(1, -1).join("|"));
        if (startQuery) mapUrl.searchParams.set("origin", startQuery);
        mapUrl.searchParams.set("travelmode", "transit");
        const link = document.getElementById("map-link");
        link.href = mapUrl.toString();
        link.hidden = false;
        routeResult = { order: routeStops.map((p) => p.id) };
      });
    }
    document.getElementById("optimize-route").addEventListener("click", async (event) => {
      const selected = places.filter((p) => p.selected);
      const startQuery = document.getElementById("start-location").value.trim();
      if (!selected.length) {
        showMessage("請先勾選至少一個景點。", true);
        return;
      }
      if (selected.length > 20) {
        showMessage("一次最多規劃 20 個景點，請分批安排。", true);
        return;
      }
      clearMessage();
      const button = event.currentTarget;
      button.disabled = true;
      button.textContent = "正在搜尋地點並計算路線…";
      try {
        const points = [];
        const placesByIndex = [];
        if (startQuery) {
          showMessage("正在搜尋起點…");
          points.push(await geocode(`${startQuery} Japan`));
          placesByIndex.push(null);
        }
        for (let i = 0; i < selected.length; i++) {
          showMessage(`正在搜尋景點 ${i + 1}/${selected.length}…`);
          if (i > 0 || startQuery) await wait(1050);
          points.push(await geocode(queryFor(selected[i])));
          placesByIndex.push(selected[i]);
        }
        showMessage("找到景點，正在計算較順路的拜訪順序…");
        const matrix = await durationMatrix(points);
        const order = optimizeOrder(matrix, Boolean(startQuery));
        await renderRoute(selected, matrix, order, Boolean(startQuery), points, placesByIndex);
        showMessage("已依道路車程估算排序。想採用大眾運輸時，請在 Google 地圖確認各段交通。");
      } catch (error) {
        console.error("路線規劃失敗。", error);
        showMessage(error.message || "路線規劃失敗，請確認網路連線後再試。", true);
      } finally {
        button.disabled = false;
        button.textContent = "✦　優化並規劃路線";
      }
    });
    document.getElementById("search").addEventListener("input", (event) => {
      searchText = event.target.value.trim();
      render();
    });
    document.querySelectorAll("[data-filter]").forEach((chip) => {
      chip.addEventListener("click", () => {
        activeFilter = chip.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach((button) => button.classList.toggle("active", button === chip));
        render();
      });
    });
    document.getElementById("select-visible").addEventListener("click", () => {
      places.filter((p) => matchesFilter(p) && `${p.name} ${p.region} ${p.type} ${p.city}`.toLowerCase().includes(searchText.toLowerCase())).forEach((p) => { p.selected = true; });
      persist(); render();
    });
    document.getElementById("clear-selection").addEventListener("click", () => {
      places.forEach((p) => { p.selected = false; });
      routeResult = null;
      persist(); render();
      document.getElementById("route-summary").innerHTML = '<div class="empty-route">先勾選想去的景點，再按「優化並規劃路線」</div>';
      document.getElementById("map-link").hidden = true;
      clearMessage();
    });
    document.getElementById("add-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const values = new FormData(form);
      places.unshift({
        id: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        name: String(values.get("name")).trim(),
        region: String(values.get("address") || values.get("region")).trim() || String(values.get("region")).trim(),
        address: String(values.get("address") || "").trim(),
        city: String(values.get("city") || "京都"),
        type: String(values.get("type") || "").trim(),
        price: String(values.get("price") || "").trim(),
        note: String(values.get("note") || "").trim(),
        selected: false,
        custom: true
      });
      persist();
      form.reset();
      render();
      clearMessage();
    });
    render();
  </script>
</body>
</html>
